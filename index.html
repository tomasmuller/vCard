  <style>
    /* Allo 1.0.3 by Josh Puckett, SIL Open Font License 1.1 (fonts/OFL.txt).
       Subset to the letters of the name and the two links. */
    @font-face {
      font-family: Allo;
      src: url(fonts/allo-1.0.3-subset.woff2) format("woff2");
      font-weight: 100 900;
      font-display: swap;
    }

    /* Until Allo arrives: Arial Bold, scaled so the name is exactly as wide as it will be.
       Android has no Arial; its Roboto already matches within half a percent. */
    @font-face {
      font-family: "Allo fallback";
      src: local("Arial Bold"), local("Arial-BoldMT");
      font-weight: 100 900;
      size-adjust: 94.9%;
      ascent-override: 102.1%;
      descent-override: 25.4%;
      line-gap-override: 0%;
    }

    /* Two colors. Without scripts they are the signature pair: deep ruby, light cyan.
       With scripts the hour picks the deep hue and every pluck moves the light one. */
    :root {
      --deep: #6a0300;
      --light: #77ebff;
      --ground: var(--light);
      --figure: var(--deep);
      --swap: 0.18s;
      color-scheme: light dark;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --ground: var(--deep);
        --figure: var(--light);
      }
    }

    @media (prefers-contrast: more) {
      :root {
        --deep: #5c0200;
        --light: #93efff;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      :root {
        --swap: 0.5s;
      }
    }

    *,
    ::before,
    ::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    [hidden] {
      display: none !important;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    html {
      background: var(--ground);
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      font: 650 1em/1 Allo, "Allo fallback", sans-serif;
      font-variation-settings: "ROND" 100;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* The stage never scrolls. Sizes follow its smaller side, so a landscape phone
       and an ultrawide monitor obey one rule. */
    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      container-type: size;
    }

    /* Two full-screen fields hold the same words in opposite colors. The upper one is
       clipped to the far side of the line, so text is always painted in the opposite
       color of whatever is under it. */
    .field {
      --pad: clamp(18px, 5.5vmin, 72px);
      position: absolute;
      inset: 0;
      isolation: isolate;
      padding:
        max(var(--pad), env(safe-area-inset-top, 0px))
        max(var(--pad), env(safe-area-inset-right, 0px))
        max(var(--pad), env(safe-area-inset-bottom, 0px))
        max(var(--pad), env(safe-area-inset-left, 0px));
      background: var(--ground);
      color: var(--figure);
      transition: background-color var(--swap), color var(--swap);
    }

    .over {
      background: var(--figure);
      color: var(--ground);
      clip-path: polygon(0 100%, 100% 0, 100% 100%);
      pointer-events: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .card {
      --link: clamp(22px, 5vmin, 64px);
      --icon: clamp(26px, 4.2vmin, 52px);
      position: relative;
      height: 100%;
      display: grid;
      place-items: center start;
      container-type: size;
    }

    @supports (width: 1cqmin) {
      .field {
        --pad: clamp(18px, 5.5cqmin, 72px);
      }

      .card {
        --link: clamp(22px, 5cqmin, 64px);
        --icon: clamp(26px, 4.2cqmin, 52px);
      }
    }

    /* The name. Stacked, its widest word spans the card; on one line the whole name does.
       The divisors are the measured widths of "Augusto" and of the full name, in em. */
    .name {
      font-size: min(23vw, 18vh);
      font-size: min(100cqw / 3.96, 20cqh);
      font-weight: 800;
      font-variation-settings: "ROND" 100, "opsz" 32;
      line-height: 0.96;
      white-space: nowrap;
    }

    .name span {
      display: block;
    }

    @media (min-aspect-ratio: 5/4) {
      .card {
        place-items: center;
      }

      .name {
        font-size: min(9vw, 22vh);
        font-size: min(100cqw / 10.16, 24cqh);
      }

      .name span {
        display: inline;
      }
    }

    .link {
      position: absolute;
      z-index: 1;
      margin: -0.55em -0.45em;
      padding: 0.55em 0.45em;
      border-radius: 0.5em;
      color: inherit;
      font-size: var(--link);
      text-decoration: underline;
      text-decoration-thickness: 0.09em;
      text-underline-offset: 0.2em;
      outline-offset: -0.28em;
    }

    .logs {
      top: 0;
      left: 0;
    }

    .in {
      right: 0;
      bottom: 0;
    }

    .snd {
      position: absolute;
      z-index: 1;
      top: 0;
      right: 0;
      width: calc(var(--icon) + 20px);
      height: calc(var(--icon) + 20px);
      margin: calc((var(--link) - var(--icon)) / 2 - 10px) -10px 0 0;
      padding: 10px;
      border: 0;
      border-radius: 50%;
      background: none;
      color: inherit;
      cursor: pointer;
      outline-offset: -5px;
    }

    .snd svg {
      display: block;
      width: 100%;
      height: 100%;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .snd .cone {
      fill: currentColor;
      stroke-width: 2;
    }

    .snd .waves,
    .sound .snd .mute {
      display: none;
    }

    .sound .snd .waves {
      display: inline;
    }

    /* The line is a button for keyboards and screen readers. It has no box of its own:
       when it holds focus, the line itself is drawn, each half in the other side's color. */
    .pluck {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      border: 0;
      background: none;
      outline: 0;
      pointer-events: none;
    }

    .rope {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      fill: none;
      stroke: currentColor;
      stroke-width: 8px;
      opacity: 0;
      pointer-events: none;
    }

    .keys .rope {
      opacity: 1;
    }

    :focus-visible {
      outline: 0.1em solid;
    }

    .snd:focus-visible {
      outline-width: 2px;
    }

    /* Focus and hover are mirrored onto the copy in the upper field, so a ring or a
       thicker underline changes color where the line crosses it, like everything else. */
    .stage:has(#logs:focus-visible) .over .logs,
    .stage:has(#in:focus-visible) .over .in {
      outline: 0.1em solid;
    }

    .stage:has(#snd:focus-visible) .over .snd {
      outline: 2px solid;
    }

    @media (hover: hover) {
      a.link:hover {
        text-decoration-thickness: 0.17em;
      }

      .stage:has(#logs:hover) .over .logs,
      .stage:has(#in:hover) .over .in {
        text-decoration-thickness: 0.17em;
      }
    }

    /* With scripts the whole stage is the instrument: press anywhere and drag. */
    .js .stage {
      cursor: grab;
      touch-action: pinch-zoom;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    .js .stage.held {
      cursor: grabbing;
    }

    .js .stage a {
      cursor: pointer;
      -webkit-touch-callout: default;
    }

    @media (prefers-reduced-motion: reduce) {
      .js .stage {
        cursor: pointer;
      }
    }

    @media (forced-colors: active) {
      .field {
        forced-color-adjust: none;
        background: Canvas;
        color: CanvasText;
      }

      .over {
        background: CanvasText;
        color: Canvas;
      }
    }
  </style>
  <script>
    (() => {
      const doc = document;
      const root = doc.documentElement;
      const media = (query) => matchMedia(`(${query})`);
      const calm = media('prefers-reduced-motion: reduce');
      const stark = media('prefers-contrast: more');

      // Colors: twelve hues 30° apart, each with a light and a deep swatch. Any light one
      // pairs with any deep one. Each string is twelve hex colors, wheel step 0 (ruby) first;
      // the second string is the wider gap for visitors who ask for more contrast.
      // Generated and checked by _tools/swatches.mjs.
      const LIGHT = [
        'ffc9bfffcca3fed252cbe66d89f3a238f7db77ebffb1deffc8d6ffdeceffffbff8ffc5d5',
        'ffd2caffd5b3ffda74d1ed7490faa843fee293efffbee4ffd1ddffe3d6ffffcaf9ffcfdc',
      ];
      const DEEP = [
        '6a0300512a00433300303b0000421a003f36003d460039581a2485450f795c0059660033',
        '5c02004724003a2c0029330000391500372f00353c00314d15197c3d006f50004d59002b',
      ];
      const themes = doc.querySelectorAll('meta[name="theme-color"]');
      const hour = () => new Date().getHours() % 12;
      const hex = (band, step) => '#' + band[+stark.matches].slice(step * 6, step * 6 + 6);

      let deep = hour(); // the hour picks the deep hue
      let light = (deep + 6) % 12; // the light hue starts opposite it; each pluck moves it one step

      const paint = () => {
        const d = hex(DEEP, deep);
        const l = hex(LIGHT, light);
        root.style.setProperty('--deep', d);
        root.style.setProperty('--light', l);
        themes[0].content = l;
        themes[1].content = d;
      };

      paint(); // before the first frame, so the page never flashes the signature pair
      root.classList.add('js');
      stark.addEventListener('change', paint);
      setInterval(() => {
        if (deep !== hour()) {
          deep = hour();
          paint();
        }
      }, 30000);

      doc.addEventListener('DOMContentLoaded', () => {
        const stage = doc.getElementById('stage');
        const over = stage.querySelector('.over');
        const ropes = stage.querySelectorAll('.rope path');
        const line = doc.getElementById('pluck');
        const snd = doc.getElementById('snd');

        // The line is a string fixed at two corners, kept as the sum of its first modes:
        // displacement(s) = Σ pos[n] · sin(nπs). Each mode is a damped oscillator that is
        // stepped exactly, so the motion is the same at any frame rate.
        const MODES = 26;
        const SEGS = 64;
        const TAU = 2 * Math.PI;
        const PITCH = 2.7; // Hz. Slow enough to read as a wave, and under three flashes a second.
        const pos = new Float64Array(MODES);
        const vel = new Float64Array(MODES);
        const goal = new Float64Array(MODES);
        const wave = Array.from(pos, (_, n) =>
          Float64Array.from({ length: SEGS + 1 }, (_, k) => Math.sin(((n + 1) * Math.PI * k) / SEGS)));

        let W, H, L; // stage width, height and diagonal
        let hold = null; // the finger on the string, if any
        let raf = 0;
        let then = 0;

        const measure = () => {
          W = stage.clientWidth;
          H = stage.clientHeight;
          L = Math.hypot(W, H);
        };

        // A string pulled to (x, y) makes two straight runs that meet at the finger. In modes
        // that shape is sin(nπs)/n², softened so the cut-off series does not ripple, and
        // scaled so the curve passes through the finger.
        // Returns where along the string the finger is (0..1) and how far it has pulled (px).
        const aim = (x, y) => {
          const s = Math.min(0.93, Math.max(0.07, (x * W + (H - y) * H) / (L * L)));
          const pull = ((H - y) * W - x * H) / L;
          let peak = 0;
          for (let n = 0; n < MODES; n++) {
            const a = Math.sin((n + 1) * Math.PI * s);
            const t = ((n + 1) * Math.PI) / (MODES + 1);
            goal[n] = (a / ((n + 1) * (n + 1))) * (Math.sin(t) / t);
            peak += goal[n] * a;
          }
          for (let n = 0; n < MODES; n++) goal[n] *= pull / peak;
          return [s, pull];
        };

        const draw = (moving) => {
          const at = (x, y) => x.toFixed(1) + ' ' + y.toFixed(1);
          let d = 'M0 ' + H;
          let px = 0;
          let py = H;
          for (let k = 1; k <= SEGS; k++) {
            let u = 0;
            for (let n = 0; n < MODES; n++) u += pos[n] * wave[n][k];
            const x = (W * k) / SEGS - (u * H) / L;
            const y = H - (H * k) / SEGS - (u * W) / L;
            // A smooth curve: each sample steers the bend between its two midpoints.
            d += (k > 1 ? 'Q' + at(px, py) + ' ' : 'L') + at((px + x) / 2, (py + y) / 2);
            px = x;
            py = y;
          }
          d += 'L' + W + ' 0';
          // At rest the stylesheet's own corner-to-corner clip takes over again.
          over.style.clipPath = moving ? `path("${d}L${W} ${H}Z")` : '';
          if (stage.classList.contains('keys')) ropes.forEach((rope) => rope.setAttribute('d', d));
        };

        const frame = (now) => {
          const dt = Math.min(0.05, (now - then) / 1000);
          then = now;
          let moving = !!hold;
          if (hold) {
            // The string eases to the finger in about a tenth of a second, then stays on it.
            aim(hold.x, hold.y);
            const k = 1 - Math.exp(-dt / (now - hold.at < 130 ? 0.04 : 0.012));
            for (let n = 0; n < MODES; n++) {
              pos[n] += (goal[n] - pos[n]) * k;
              vel[n] = 0;
            }
          } else {
            for (let n = 0; n < MODES; n++) {
              const w = TAU * PITCH * (n + 1);
              const g = Math.min(3.4 + 1.6 * n * n, 0.9 * w); // higher modes die sooner
              const wd = Math.sqrt(w * w - g * g);
              const e = Math.exp(-g * dt);
              const c = Math.cos(wd * dt);
              const s = Math.sin(wd * dt);
              const p = pos[n];
              const v = vel[n];
              pos[n] = e * (p * c + ((v + g * p) / wd) * s);
              vel[n] = e * (v * c - ((w * w * p + g * v) / wd) * s);
              if (Math.abs(pos[n]) > 0.2 || Math.abs(vel[n]) > 4) moving = true;
            }
            if (!moving) {
              pos.fill(0);
              vel.fill(0);
            }
          }
          draw(moving);
          raf = moving ? requestAnimationFrame(frame) : 0;
        };

        const wake = () => {
          if (raf) return;
          then = performance.now();
          raf = requestAnimationFrame(frame);
        };

        // Sound stays off until the visitor asks for it. Then every pluck plays one note:
        // the high E string of a guitar, fretted at the wheel step the light hue lands on.
        const Sound = window.AudioContext || window.webkitAudioContext;
        let audio;
        let out;
        let voice;
        let loud = false;

        const hush = () => voice && voice.gain.setTargetAtTime(0, audio.currentTime, 0.02);

        // A plucked string by Karplus and Strong's method: a burst of noise goes round a delay
        // line one period long and loses a little brightness on every lap.
        const twang = (fret, force, where) => {
          const rate = audio.sampleRate;
          const freq = 329.63 * 2 ** (fret / 12);
          const size = Math.floor(rate * 2.4);
          const buffer = audio.createBuffer(1, size, rate);
          const y = buffer.getChannelData(0);
          const period = Math.round(rate / freq);
          const pick = Math.max(2, Math.round(period * Math.min(where, 1 - where)));
          const lag = rate / freq - 0.5; // the averaging below adds the other half sample
          const whole = Math.floor(lag - 0.1);
          const part = lag - whole;
          const tune = (1 - part) / (1 + part); // an all-pass delays by the fraction, so the note is in tune
          const keep = Math.exp(-6.9 / (freq * 2.8)); // rings for a couple of seconds
          const burst = new Float32Array(period);
          let soft = 0;
          for (let i = 0; i < period; i++) {
            soft += (0.16 + 0.34 * force) * (Math.random() * 2 - 1 - soft); // a harder pluck is brighter
            burst[i] = soft;
          }
          let x1 = 0;
          let y1 = 0;
          let top = 0;
          for (let i = 0; i < size; i++) {
            const x = ((i >= whole ? y[i - whole] : 0) + (i > whole ? y[i - whole - 1] : 0)) / 2;
            y1 = tune * (x - y1) + x1;
            x1 = x;
            // Where the string is plucked shapes the tone: the burst meets its own echo.
            y[i] = keep * y1 + (i < period ? burst[i] : 0) - (i >= pick && i < period + pick ? burst[i - pick] : 0);
            top = Math.max(top, Math.abs(y[i]));
          }
          const tail = rate * 0.5;
          for (let i = 0; i < size; i++) y[i] *= Math.min(1, (size - i) / tail) / top;

          hush(); // one string, one note at a time
          voice = audio.createGain();
          voice.gain.value = 0.25 + 0.55 * force;
          voice.connect(out);
          const source = audio.createBufferSource();
          source.buffer = buffer;
          source.connect(voice);
          source.start();
        };

        // One fret up the string: the light hue moves one step along the wheel.
        const next = (force, where) => {
          light = (light + 1) % 12;
          paint();
          if (loud) twang(light, force, where);
        };

        const letGo = (ring) => {
          const [where, pull] = aim(hold.x, hold.y);
          hold = null;
          stage.classList.remove('held');
          if (ring) next(Math.min(1, Math.abs(pull) / (0.3 * Math.min(W, H))), where);
        };

        // A pluck with no finger, for the keyboard: pull a little, then let go.
        const strum = () => {
          if (hold) return;
          const reach = 0.11 * Math.min(W, H);
          const mine = { x: W * 0.4 - (reach * H) / L, y: H * 0.6 - (reach * W) / L, at: performance.now() };
          hold = mine;
          if (calm.matches) return letGo(true);
          wake();
          setTimeout(() => hold === mine && letGo(true), 120);
        };

        stage.addEventListener('pointerdown', (event) => {
          if (hold || event.button || event.target.closest('a, button')) return;
          event.preventDefault();
          try {
            stage.setPointerCapture(event.pointerId);
          } catch (_) {}
          hold = { id: event.pointerId, x: event.clientX, y: event.clientY, at: performance.now() };
          stage.classList.add('held');
          if (!calm.matches) wake(); // with reduced motion the line stays still and only the colors change
        });

        stage.addEventListener('pointermove', (event) => {
          if (!hold || hold.id !== event.pointerId) return;
          hold.x = event.clientX;
          hold.y = event.clientY;
        });

        const lift = (event) => {
          if (hold && hold.id === event.pointerId) letGo(event.type === 'pointerup');
        };
        stage.addEventListener('pointerup', lift);
        // However else the finger is lost, the string goes back without counting as a pluck.
        stage.addEventListener('pointercancel', lift);
        stage.addEventListener('lostpointercapture', lift);
        stage.addEventListener('contextmenu', () => hold && letGo(false));
        addEventListener('blur', () => hold && letGo(false));

        line.hidden = false;
        line.addEventListener('click', strum);
        line.addEventListener('keydown', (event) => event.repeat && event.preventDefault());
        line.addEventListener('focus', () => {
          stage.classList.toggle('keys', line.matches(':focus-visible'));
          draw(!!raf);
        });
        line.addEventListener('blur', () => stage.classList.remove('keys'));

        if (Sound) {
          stage.querySelectorAll('.snd').forEach((button) => (button.hidden = false));
          snd.addEventListener('click', () => {
            loud = !loud;
            snd.setAttribute('aria-pressed', loud);
            stage.classList.toggle('sound', loud);
            if (!loud) return hush();
            if (!audio) {
              audio = new Sound();
              out = audio.createBiquadFilter();
              out.type = 'lowpass';
              out.frequency.value = 5200;
              out.connect(audio.destination);
            }
            audio.resume();
            // The visitor asked for sound, so an iPhone's silent switch should not swallow it.
            if (navigator.audioSession) navigator.audioSession.type = 'playback';
            strum();
          });
        }

        addEventListener('resize', () => {
          measure();
          draw(!!raf);
        });
        measure();

        // The line settles with one small wobble: the only hint that it is elastic.
        if (!calm.matches) {
          setTimeout(() => {
            if (hold || raf) return;
            vel[0] = 0.03 * Math.min(W, H) * TAU * PITCH;
            wake();
          }, 400);
        }
      });
    })();
  </script>

  {
